<title>Styber Menswear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap">
<style>
/* Layout: black brand bands (bar, header, footer) framing a bone-white shop floor; product rails scroll sideways, tiles in grids */
:root{
  --ink:#0d0d0c; --ink-2:#1b1a18; --paper:#f6f4ef; --card:#ffffff; --line:#e2ded5;
  --fg:#141412; --muted:#6c675e; --gold:#a8792c; --gold-soft:#f3e7cf; --sale:#b3261e; --ok:#2f6b3a;
  --band-fg:#f6f4ef;
  --display:"Jost","Futura","Century Gothic","Segoe UI",sans-serif;
  --body:"Karla","Helvetica Neue",Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121210; --card:#1c1b19; --line:#2e2c28; --fg:#ece8df; --muted:#a29c90; --gold:#d3a75a; --gold-soft:#3a2f1c; --sale:#ef7469; --ok:#7fc08a; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121210; --card:#1c1b19; --line:#2e2c28; --fg:#ece8df; --muted:#a29c90; --gold:#d3a75a; --gold-soft:#3a2f1c; --sale:#ef7469; --ok:#7fc08a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}

/* announcement */
.announce{background:var(--ink-2);color:var(--band-fg);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;text-align:center;overflow:hidden;white-space:nowrap}
.announce .wrap{padding-block:8px}
.announce span{color:#d9b46a}

/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--band-fg)}
.hbar{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.logo img{height:40px;width:auto;display:block}
.logo b{font-family:var(--display);font-weight:600;letter-spacing:.42em;font-size:19px;padding-left:.1em}
.iconbtn{background:none;border:0;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative;color:var(--band-fg)}
.iconbtn:hover{background:#ffffff14}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
.count{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:#d9b46a;color:#111;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.menu-toggle{display:none}
nav.main{border-top:1px solid #ffffff1a}
nav.main>ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center;gap:4px}
nav.main>ul>li{position:relative}
nav.main>ul>li>button,nav.main>ul>li>a{background:none;border:0;display:block;padding:12px 16px;font-family:var(--display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#e6e1d6}
nav.main>ul>li>button:hover,nav.main>ul>li>a:hover,nav.main li.open>button{color:#d9b46a}
.drop{position:absolute;left:50%;transform:translateX(-50%);top:100%;background:var(--card);color:var(--fg);min-width:230px;border-radius:0 0 var(--r) var(--r);box-shadow:0 18px 40px #0004;padding:10px;display:none;list-style:none;margin:0}
nav.main li:hover .drop,nav.main li.open .drop{display:block}
.drop a{display:block;padding:9px 12px;border-radius:4px;text-decoration:none;font-size:14.5px}
.drop a:hover{background:var(--gold-soft)}
.drop .all{font-weight:700;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:4px}

/* search */
.searchbar{background:var(--ink);padding-block:0 12px}
.searchbar input{width:100%;padding:11px 14px;border-radius:var(--r);border:1px solid #ffffff2a;background:#ffffff12;color:var(--band-fg);font:inherit}
.searchbar input::placeholder{color:#bdb7ab}

/* hero */
.hero{background:var(--ink);color:var(--band-fg);overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding-block:44px 52px}
.hero h1{font-size:clamp(34px,5.4vw,66px);line-height:1.02;font-weight:500;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:#d9b46a}
.hero p{color:#c9c3b7;max-width:44ch;font-size:16.5px;margin:16px 0 26px}
.hero .eyebrow{color:#a49d90}
.cta{display:inline-flex;align-items:center;gap:10px;background:#f6f4ef;color:#111;border:0;padding:14px 26px;border-radius:2px;font-family:var(--display);letter-spacing:.18em;text-transform:uppercase;font-size:13px;font-weight:600;text-decoration:none}
.cta.ghost{background:transparent;color:#f6f4ef;border:1px solid #ffffff55}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{position:relative;display:grid;place-items:center;min-height:300px}
.hero-art .mark{width:min(80%,300px);opacity:.95;animation:rise 1.4s ease-out both}
.hero-art .ring{position:absolute;width:min(92%,360px);aspect-ratio:1;max-width:100%;border:1px solid #d9b46a55;border-radius:50%}
.hero-art .ring.r2{width:min(70%,270px);border-color:#ffffff1f}
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:.95}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* sections */
section.block{padding-block:44px 8px}
.shead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.shead h2{font-size:clamp(22px,2.8vw,30px);font-weight:500;letter-spacing:.02em}
.link{background:none;border:0;padding:0;font-family:var(--display);font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;text-decoration:underline;text-underline-offset:5px;color:var(--fg)}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat{background:none;border:0;padding:0;text-align:left}
.cat .tile{aspect-ratio:4/5;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;transition:transform .25s}
.cat:hover .tile{transform:translateY(-3px)}
.cat .tile svg{width:74%;height:auto}
.cat span{display:block;margin-top:9px;font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:30px;font-size:13.5px;font-weight:600}
.tab[aria-selected="true"]{background:var(--fg);color:var(--paper);border-color:var(--fg)}

/* product rail + grid */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,23%);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 16px}
.pcard{min-width:0;display:flex;flex-direction:column}
.pimg{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;padding:0;width:100%}
.pimg svg{width:80%;height:auto;transition:transform .35s}
.pimg:hover svg{transform:scale(1.05)}
.badge{position:absolute;top:10px;left:10px;background:var(--sale);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:2px}
.badge.new{background:var(--fg);color:var(--paper);left:auto;right:10px}
.pinfo{padding-top:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.pinfo .sub{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pinfo h3{font-family:var(--body);font-size:14.5px;font-weight:600;line-height:1.35}
.price{display:flex;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums;margin-top:2px}
.price b{font-size:15.5px}
.price s{color:var(--muted);font-size:13px}
.price .off{color:var(--ok);font-size:12.5px;font-weight:700}
.addbtn{margin-top:10px;border:1px solid var(--fg);background:transparent;padding:9px;font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border-radius:2px}
.addbtn:hover{background:var(--fg);color:var(--paper)}

/* trust */
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-block:1px solid var(--line);padding-block:26px;margin-top:40px}
.trust div{display:flex;gap:14px;align-items:flex-start}
.trust svg{width:30px;height:30px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.5}
.trust b{display:block;font-family:var(--display);font-weight:600;letter-spacing:.04em}
.trust p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* store banner */
.storeband{margin-top:44px;background:var(--ink);color:var(--band-fg);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;padding:34px clamp(20px,4vw,48px);position:relative}
.storeband h2{font-size:clamp(24px,3.2vw,38px);font-weight:500}
.storeband p{color:#c9c3b7;margin:8px 0 0}
.storeband img{height:110px;opacity:.18;position:absolute;right:24px;bottom:-8px;pointer-events:none}

/* collection page */
.crumbs{font-size:13px;color:var(--muted);padding-top:22px}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline}
.colhead{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;padding-block:10px 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.colhead h1{font-size:clamp(28px,4vw,44px);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:20px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);font-weight:700}
select{font:inherit;padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--fg)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* stores */
.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.store{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.store h3{font-size:18px;font-weight:600}
.store .tag{align-self:flex-start;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold);padding:3px 8px;border-radius:2px;font-weight:700}
.store p{margin:0;color:var(--muted);font-size:14px}

/* newsletter + footer */
.join{margin-top:52px;border-top:1px solid var(--line);padding-block:40px;display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:center}
.join h2{font-size:28px;font-weight:500}
.join form{display:flex;gap:10px;flex-wrap:wrap}
.join input{flex:1 1 180px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--fg);font:inherit}
.join button{background:var(--fg);color:var(--paper);border:0;padding:12px 22px;font-family:var(--display);letter-spacing:.16em;text-transform:uppercase;font-size:12.5px;font-weight:600;border-radius:2px}
.join .msg{flex-basis:100%;font-size:14px;color:var(--ok);margin:0}
footer{background:var(--ink);color:#c9c3b7;margin-top:10px}
footer .wrap{padding-block:40px 28px;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:24px}
footer img{height:96px}
footer h4{font-family:var(--display);color:var(--band-fg);font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:13px;margin:0 0 12px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
footer button{background:none;border:0;padding:0;color:#c9c3b7;text-align:left}
footer button:hover{color:#d9b46a}
.copy{border-top:1px solid #ffffff1a;font-size:12.5px;color:#8f897d}
.copy .wrap{display:block;padding-block:16px}

/* overlay panels */
.scrim{position:fixed;inset:0;background:#0009;z-index:70}
.drawer{position:fixed;top:0;bottom:auto;height:100vh;height:100dvh;right:0;width:min(420px,100%);background:var(--paper);z-index:80;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-20px 0 50px #0005}
.drawer.left{right:auto;left:0;padding-right:0;padding-left:env(safe-area-inset-left,0px);background:var(--ink);color:var(--band-fg)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer.left .dhead{border-color:#ffffff1a}
.dhead h2{font-size:17px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.dbody{flex:1;overflow-y:auto;padding:14px 18px}
.dfoot{border-top:1px solid var(--line);padding:16px 18px;display:grid;gap:10px}
.xbtn{background:none;border:0;font-size:26px;line-height:1;width:36px;height:36px}
.citem{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);align-items:center}
.citem .thumb{aspect-ratio:4/5;background:var(--card);border:1px solid var(--line);border-radius:4px;display:grid;place-items:center}
.citem .thumb svg{width:80%}
.citem h3{font-family:var(--body);font-size:14px;font-weight:600}
.citem small{color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:2px;margin-top:6px}
.qty button{background:none;border:0;width:30px;height:28px}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.rm{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px}
.row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.row.total{font-size:17px;font-weight:700}
.primary{background:var(--fg);color:var(--paper);border:0;padding:14px;font-family:var(--display);letter-spacing:.18em;text-transform:uppercase;font-size:13px;font-weight:600;border-radius:2px;width:100%}
.primary:disabled{opacity:.4;cursor:not-allowed}
.mnav{list-style:none;margin:0;padding:0}
.mnav>li{border-bottom:1px solid #ffffff14}
.mnav>li>button,.mnav>li>a{width:100%;background:none;border:0;text-align:left;padding:15px 2px;font-family:var(--display);letter-spacing:.16em;text-transform:uppercase;font-size:14px;display:flex;justify-content:space-between;text-decoration:none;color:var(--band-fg)}
.mnav ul{list-style:none;margin:0;padding:0 0 10px 10px}
.mnav ul button{background:none;border:0;color:#c9c3b7;padding:9px 0;font-size:15px;width:100%;text-align:left}

/* modal */
.modal{position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.mbox{pointer-events:auto;background:var(--paper);border-radius:var(--r);width:min(880px,100%);max-height:100%;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;position:relative}
.mbox .pimg{border:0;border-radius:0;cursor:default;height:100%}
.mbox .xbtn{position:absolute;top:8px;right:8px;z-index:2}
.mdet{padding:28px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mdet h2{font-size:24px;font-weight:500}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{min-width:46px;padding:9px 10px;border:1px solid var(--line);background:var(--card);border-radius:2px;font-weight:600;font-size:13.5px}
.size[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--paper)}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--sale);font-size:13px;margin:0}
.det-list{margin:0;padding-left:18px;color:var(--muted);font-size:14px}

/* checkout */
.form{display:grid;gap:10px}
.form label{font-size:13px;font-weight:600;display:grid;gap:4px}
.form input,.form textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--fg)}
.pay{display:grid;gap:8px}
.pay label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:11px 12px;border-radius:2px;font-weight:500;background:var(--card)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--paper);padding:11px 18px;border-radius:30px;font-size:14px;z-index:90;box-shadow:0 10px 30px #0004}

@media (max-width:980px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .cats{grid-template-columns:repeat(4,1fr)}
  footer .wrap{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  nav.main{display:none}
  .menu-toggle{display:grid}
  .logo b{display:none}
  .logo img{height:36px}
  .hero .wrap{grid-template-columns:1fr;padding-block:30px 34px}
  .hero-art{min-height:200px;order:-1}
  .hero-art .mark{width:150px}
  .hero-art .ring{width:220px}.hero-art .ring.r2{width:170px}
  .grid{grid-template-columns:repeat(2,1fr);gap:20px 12px}
  .rail{grid-auto-columns:minmax(160px,46%)}
  .cats{grid-template-columns:repeat(3,1fr);gap:10px}
  .trust,.stores{grid-template-columns:1fr}
  .storeband{grid-template-columns:1fr}
  .join{grid-template-columns:1fr}
  .mbox{grid-template-columns:1fr}
  .mbox .pimg{max-height:46vh}
  .mbox .pimg svg{width:56%}
}

/* ---------- product photos ---------- */
.pimg img,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge.out{background:var(--muted)}
.size:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.addbtn:disabled{opacity:.45;cursor:not-allowed}
.coupon{display:flex;gap:8px}
.coupon input{flex:1;min-width:0}
.coupon button{border:1px solid var(--fg);background:transparent;padding:0 14px;font-weight:700;border-radius:2px}
.ok-msg{color:var(--ok);font-size:13px;margin:0}

/* ---------- admin ---------- */
:root{--info:#2d5f9a;--info-soft:#e3ecf7;--ok-soft:#e2efe4;--sale-soft:#f8e2e0;--warn:#9a6a12;--warn-soft:#f6ecd6;--violet:#5f4b8b;--violet-soft:#ebe6f4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--info:#8db6e8;--info-soft:#1d2a3a;--ok-soft:#1d2e21;--sale-soft:#3a1f1d;--warn:#e2b55e;--warn-soft:#3a2f18;--violet:#b9a6e6;--violet-soft:#2a2438}}
:root[data-theme="dark"]{--info:#8db6e8;--info-soft:#1d2a3a;--ok-soft:#1d2e21;--sale-soft:#3a1f1d;--warn:#e2b55e;--warn-soft:#3a2f18;--violet:#b9a6e6;--violet-soft:#2a2438}
body.is-admin .announce,body.is-admin header.site,body.is-admin footer{display:none}
.admin{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.aside{background:var(--ink);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.aside .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.aside .brand img{height:34px}

.aside .brand small{display:block;font-size:10.5px;letter-spacing:.2em;color:#a49d90;text-transform:uppercase}
.anav{display:grid;gap:2px}
.anav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#c9c3b7;padding:10px 12px;border-radius:5px;text-align:left;font-size:14.5px;font-weight:500;white-space:nowrap}
.anav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.anav button:hover{background:#ffffff10;color:#fff}

.anav .pill{margin-left:auto;background:#d9b46a;color:#111;border-radius:10px;font-size:11px;font-weight:700;padding:1px 7px}
.aside .foot{margin-top:auto;display:grid;gap:4px;border-top:1px solid #ffffff1a;padding-top:12px}
.amain{min-width:0;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.atop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.atop .note{margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:5px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.dark{background:var(--fg);color:var(--paper);border-color:var(--fg)}
.btn.danger{color:var(--sale);border-color:var(--sale)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.kpi .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:500;margin-top:6px;font-variant-numeric:tabular-nums}

.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>h2{font-size:16px;font-weight:600;letter-spacing:.02em;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel .pb{padding:16px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.tbl{overflow-x:auto}

.st{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}

.pthumb{width:44px;height:54px;border-radius:4px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden;flex:none}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}

.photos{display:flex;gap:10px;flex-wrap:wrap}

.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}

@media (max-width:760px){

function pattern(p,id){
  const a=p.c1,b=p.c2;
  const pats={
    plain:`<rect width="12" height="12" fill="${a}"/>`,
    stripe:`<rect width="12" height="12" fill="${a}"/><rect width="3" height="12" fill="${b}" opacity=".75"/>`,
    check:`<rect width="12" height="12" fill="${a}"/><rect width="5" height="12" fill="${b}" opacity=".7"/><rect width="12" height="5" fill="${b}" opacity=".55"/><rect x="8" width="1" height="12" fill="#d9c46a" opacity=".6"/>`,
    print:`<rect width="24" height="24" fill="${a}"/><path d="M4 10c3-6 8-6 9 0-4 1-6 2-9 0zM15 20c2-5 6-5 7 0-3 1-5 1-7 0z" fill="${b}"/><circle cx="18" cy="6" r="1.6" fill="${b}" opacity=".7"/>`,
    denim:`<rect width="6" height="6" fill="${a}"/><path d="M0 6 6 0M-1 1 1-1M5 7 7 5" stroke="${b}" stroke-width=".9" opacity=".6"/>`,
    linen:`<rect width="8" height="8" fill="${a}"/><path d="M0 2h8M0 5.5h8" stroke="${b}" stroke-width=".5" opacity=".5"/><path d="M3 0v8" stroke="${b}" stroke-width=".4" opacity=".35"/>`
  };
  const s=p.pat==="print"?24:p.pat==="denim"?6:p.pat==="linen"?8:12;
  return `<pattern id="${id}" width="${s}" height="${s}" patternUnits="userSpaceOnUse">${pats[p.pat]||pats.plain}</pattern>`;
}

   polo:`<path d="M72 30 44 40 14 66 34 94 52 82v104h96V82l18 12 20-28-30-26-28-12-10 14H82z" fill="${f}" stroke="${line}"/><path d="M72 30 82 44 100 60 118 44 128 30 116 26 100 40 84 26z" fill="${c2}" stroke="${line}"/><path d="M100 60v34" stroke="${line}"/><circle cx="104" cy="72" r="2" fill="#00000050"/><circle cx="104" cy="86" r="2" fill="#00000050"/>`,

function collection(k){
  const parent=MENU.find(m=>m.subs&&(m.key===k||m.subs.includes(k)));

  if(query){const q=query.toLowerCase();list=visible().filter(p=>(p.name+" "+CATS[p.cat]+" "+CATS[GROUP(p.cat)]).toLowerCase().includes(q))}
  if(colChip)list=list.filter(p=>inCat(p,colChip));
  if(colSort==="low")list=[...list].sort((a,b)=>a.price-b.price);
  if(colSort==="high")list=[...list].sort((a,b)=>b.price-a.price);
  if(colSort==="off")list=[...list].sort((a,b)=>off(b)-off(a));
  const chips=!query&&parent&&parent.key===k?parent.subs.filter(s=>!S.hiddenCats.includes(s)):[];
  const title=query?`Results for “${esc(query)}”`:CATS[k];
  app.innerHTML=`<div class="wrap">
   <div class="crumbs"><button data-go="home">Home</button>${parent&&parent.key!==k?` / <button data-go="${parent.key}">${parent.label}</button>`:""} / ${title}</div>
   <div class="colhead"><div><h1>${title}</h1><div class="note">${list.length} product${list.length===1?"":"s"}</div></div>

    <div class="price"><b style="font-size:21px">${rs(p.price)}</b>${p.mrp>p.price?`<s>MRP ${rs(p.mrp)}</s><span class="off">${off(p)}% off</span>`:""}</div>
    <div class="note">Inclusive of all taxes</div>
    <div><div class="eyebrow" style="margin-bottom:8px">Select size</div><div class="sizes">${p.sizes.map(s=>`<button class="size" data-size="${esc(s.s)}" aria-pressed="${size===s.s}" ${+s.stock>0?"":"disabled"}>${esc(s.s)}</button>`).join("")}</div>
    ${(()=>{const x=p.sizes.find(s=>s.s===size);return x&&+x.stock<=S.lowStock?`<p class="note" style="color:var(--sale);margin:8px 0 0">Only ${x.stock} left in this size</p>`:""})()}</div>
    <p class="err" id="sizeErr" hidden>Pick a size to add this to your cart.</p>
    <button class="primary" id="addCart" ${stockOf(p)?"":"disabled"}>${stockOf(p)?"Add to cart":"Sold out"}</button>
    <ul class="det-list"><li>${esc(p.desc)}</li><li>Free shipping above ${rs(S.freeAbove)}</li><li>7-day easy exchange and returns</li></ul>
   </div></div></div>`;
  layer.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{size=b.dataset.size;draw()});
  layer.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{photo=+b.dataset.ph;draw()});
  $("#addCart").onclick=()=>{if(!size){$("#sizeErr").hidden=false;return}
    const x=p.sizes.find(s=>s.s===size), inCart=cart.filter(c=>c.pid===p.id&&c.size===size).reduce((a,c)=>a+c.qty,0);
    if(inCart+1>+x.stock){toast(`Only ${x.stock} available in size ${size}`);return}
    addToCart(p.id,size);closeLayer();toast(`Added to cart · ${p.name} (${size})`)};
  };
  const avail=p.sizes.filter(s=>+s.stock>0);if(p.sizes.length===1&&avail.length)size=avail[0].s;
  draw();
}
function addToCart(pid,size){const f=cart.find(c=>c.pid===pid&&c.size===size);f?f.qty++:cart.push({pid,size,qty:1});saveCart()}
function saveCart(){DB.set("cart",cart);const n=cart.reduce((a,c)=>a+c.qty,0);const el=$("#cartCount");el.textContent=n;el.hidden=!n}
let appliedCoupon=null;
function couponDiscount(c,sub){if(!c)return 0;return Math.min(sub,c.type==="pct"?Math.round(sub*c.value/100):c.value)}
const totals=()=>{const sub=cart.reduce((a,c)=>a+byId(c.pid).price*c.qty,0);const mrp=cart.reduce((a,c)=>{const p=byId(c.pid);return a+Math.max(p.mrp,p.price)*c.qty},0);
  if(appliedCoupon&&sub<appliedCoupon.min)appliedCoupon=null;
  const discount=couponDiscount(appliedCoupon,sub);const ship=sub===0||sub>=S.freeAbove?0:+S.shipFee;return{sub,mrp,discount,ship,total:sub-discount+ship}};
function openCart(){
  const t=totals();
  layer.innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="Cart">
   <div class="dhead"><h2>Your cart</h2><button class="xbtn" data-close aria-label="Close">&times;</button></div>
   <div class="dbody">${cart.length?cart.map((c,i)=>{const p=byId(c.pid);return `<div class="citem"><div class="thumb">${pic(p)}</div><div style="min-width:0"><h3>${esc(p.name)}</h3><small>Size ${esc(c.size)} · ${rs(p.price)}</small><br><span class="qty"><button data-q="${i}" data-d="-1" aria-label="Less">−</button><span>${c.qty}</span><button data-q="${i}" data-d="1" aria-label="More">+</button></span></div><div style="text-align:right"><b>${rs(p.price*c.qty)}</b><br><button class="rm" data-rm="${i}">Remove</button></div></div>`}).join(""):`<div class="empty">Your cart is empty.<br><br><button class="addbtn" data-go="new" style="padding:10px 20px">Continue shopping</button></div>`}</div>
   ${cart.length?`<div class="dfoot">
     <div class="coupon"><input id="cpIn" placeholder="Coupon code" value="${appliedCoupon?esc(appliedCoupon.code):""}" style="padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--fg);font:inherit;text-transform:uppercase"><button id="cpBtn">${appliedCoupon?"Remove":"Apply"}</button></div>
     <p class="err" id="cpErr" hidden></p>${appliedCoupon?`<p class="ok-msg">${esc(appliedCoupon.code)} applied</p>`:""}
     <div class="row"><span>Subtotal</span><span>${rs(t.sub)}</span></div>
     ${t.discount?`<div class="row" style="color:var(--ok)"><span>Coupon</span><span>−${rs(t.discount)}</span></div>`:""}
     <div class="row" style="color:var(--ok)"><span>You save</span><span>${rs(t.mrp-t.sub+t.discount)}</span></div>
     <div class="row"><span>Shipping</span><span>${t.ship?rs(t.ship):"Free"}</span></div><div class="row total"><span>Total</span><span>${rs(t.total)}</span></div><button class="primary" id="checkout">Checkout</button></div>`:""}
  </aside>`;
  const co=$("#checkout");if(co)co.onclick=checkout;
  const cb=$("#cpBtn");if(cb)cb.onclick=()=>{
    if(appliedCoupon){appliedCoupon=null;openCart();return}
    const code=$("#cpIn").value.trim().toUpperCase();const c=coupons.find(x=>x.code===code&&x.active);const e=$("#cpErr");
    if(!c){e.textContent="This coupon code is not valid.";e.hidden=false;return}
    if(t.sub<c.min){e.textContent=`Add items worth ${rs(c.min-t.sub)} more to use ${c.code}.`;e.hidden=false;return}
    appliedCoupon=c;openCart()};
}
function checkout(){
  const t=totals();
  if(!S.cod&&!S.online){toast("Ordering is paused right now.");return}
  layer.innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="Checkout">
   <div class="dhead"><h2>Checkout</h2><button class="xbtn" data-close aria-label="Close">&times;</button></div>
   <form class="dbody form" id="coForm">
    <label>Full name<input id="coName" required autocomplete="name"></label>
    <label>Mobile number<input id="coPhone" type="tel" required pattern="[0-9 +]{10,14}" autocomplete="tel"></label>
    <label>Address<textarea id="coAddr" rows="3" required autocomplete="street-address"></textarea></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>City<input id="coCity" required></label><label>PIN code<input id="coPin" required pattern="[0-9]{6}" inputmode="numeric"></label></div>
    <div class="eyebrow" style="margin-top:6px">Payment</div>
    <div class="pay">${S.online?`<label><input type="radio" name="pay" value="UPI / Card" checked> UPI / Card / Netbanking</label>`:""}${S.cod?`<label><input type="radio" name="pay" value="Cash on Delivery" ${S.online?"":"checked"}> Cash on Delivery</label>`:""}</div>
    ${t.discount?`<div class="row" style="color:var(--ok)"><span>Coupon ${esc(appliedCoupon.code)}</span><span>−${rs(t.discount)}</span></div>`:""}
    <div class="row total" style="margin-top:6px"><span>Pay</span><span>${rs(t.total)}</span></div>
    <button class="primary" type="submit">Place order</button>
   </form></aside>`;
  $("#coForm").onsubmit=async e=>{e.preventDefault();
    for(const c of cart){const p=byId(c.pid),x=p&&p.sizes.find(s=>s.s===c.size);if(!x||+x.stock<c.qty){toast(`${p?p.name:"An item"} (${c.size}) is no longer available in that quantity.`);openCart();return}}
    const pay=(e.target.querySelector("input[name=pay]:checked")||{}).value||"UPI / Card";
    const btn=e.target.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Placing order...";
    const customer={name:$("#coName").value.trim(),phone:$("#coPhone").value.trim(),addr:$("#coAddr").value.trim(),city:$("#coCity").value.trim(),pin:$("#coPin").value.trim()};
    const coupon=appliedCoupon?{...appliedCoupon}:null;
    let o;
    try{
      o=await fdb.runTransaction(async tx=>{
        const cRef=fdb.doc("meta/counter");const cSnap=await tx.get(cRef);
        const ids=[...new Set(cart.map(c=>c.pid))];const refs=ids.map(id=>fdb.collection("products").doc(id));
        const snaps=await Promise.all(refs.map(r=>tx.get(r)));const fresh={};
        snaps.forEach(sn=>{if(!sn.exists)throw new Error("An item in your cart is no longer available.");fresh[sn.id]=sn.data()});
        for(const c of cart){const x=fresh[c.pid].sizes.find(z=>z.s===c.size);if(!x||+x.stock<c.qty)throw new Error(`${fresh[c.pid].name} (${c.size}) has only ${x?x.stock:0} left.`)}
        cart.forEach(c=>{const x=fresh[c.pid].sizes.find(z=>z.s===c.size);x.stock=+x.stock-c.qty});
        const items=cart.map(c=>({pid:c.pid,name:fresh[c.pid].name,size:c.size,qty:c.qty,price:fresh[c.pid].price}));
        const sub=items.reduce((t,i)=>t+i.price*i.qty,0);const discount=coupon&&sub>=coupon.min?couponDiscount(coupon,sub):0;const ship=sub>=S.freeAbove?0:+S.shipFee;
        const seq=(cSnap.exists?+cSnap.data().seq||1000:1000)+1;
        const order={id:"STY"+seq,date:new Date().toISOString(),customer,items,sub,ship,discount,coupon:discount?coupon.code:"",total:sub-discount+ship,pay,payStatus:pay==="Cash on Delivery"?"Pending":"Paid",status:"New",tracking:"",note:""};
        refs.forEach(r=>tx.update(r,{sizes:fresh[r.id].sizes}));
        tx.set(cRef,{seq});
        tx.set(fdb.collection("orders").doc(order.id),order);
        if(discount)tx.update(fdb.collection("coupons").doc(coupon.code),{used:firebase.firestore.FieldValue.increment(1)});
        return order;
      });
    }catch(err){console.error(err);btn.disabled=false;btn.textContent="Place order";toast(err&&err.code?"Order could not be placed. Check your internet and try again.":err.message);return}
    cart=[];appliedCoupon=null;saveCart();
    layer.innerHTML=`<div class="scrim" data-close></div><div class="modal"><div class="mbox" style="grid-template-columns:1fr;max-width:440px;text-align:center"><div class="mdet" style="align-items:center"><img src="${LOGO_MARK}" alt="" style="height:76px;background:#0d0d0c;padding:12px;border-radius:50%"><h2>Order placed</h2><p class="note" style="font-size:15px">Thanks ${esc(o.customer.name.split(" ")[0])}. Order <b>${o.id}</b> · ${pay} · ${rs(o.total)}.<br>We'll send updates to your mobile.</p><button class="primary" data-close>Continue shopping</button></div></div></div>`;
  };
}

function aDash(){
  const today=new Date();today.setHours(0,0,0,0);
  const tOrders=orders.filter(o=>new Date(o.date)>=today&&live(o));
  const month=new Date(today.getFullYear(),today.getMonth(),1);
  const mOrders=orders.filter(o=>new Date(o.date)>=month&&live(o));
  const pending=orders.filter(o=>["New","Confirmed","Packed"].includes(o.status));
  const low=products.filter(p=>p.active&&p.sizes.some(s=>+s.stock<=S.lowStock));
  // 7-day chart
  const days=[...Array(7)].map((_,i)=>{const d=new Date(today);d.setDate(d.getDate()-6+i);const n=new Date(d);n.setDate(n.getDate()+1);
    return{l:d.toLocaleDateString("en-IN",{weekday:"short"}),v:orders.filter(o=>live(o)&&new Date(o.date)>=d&&new Date(o.date)<n).reduce((a,o)=>a+o.total,0)}});
  const max=Math.max(1000,...days.map(d=>d.v));const step=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/step)*step;
  const W=560,H=210,L=44,B=28,T=18,bw=(W-L-10)/7;

function saveOrder(id){
  const o=orders.find(x=>x.id===id);const st=layer._getSt();const touched=new Set();
  const wasLive=live(o),nowLive=!["Cancelled","Returned"].includes(st);
  if(wasLive&&!nowLive)o.items.forEach(i=>{const p=byId(i.pid),x=p&&p.sizes.find(z=>z.s===i.size);if(x){x.stock=+x.stock+i.qty;touched.add(p.id)}});
  if(!wasLive&&nowLive)o.items.forEach(i=>{const p=byId(i.pid),x=p&&p.sizes.find(z=>z.s===i.size);if(x){x.stock=Math.max(0,+x.stock-i.qty);touched.add(p.id)}});
  o.status=st;o.payStatus=$("#odPay").value;o.tracking=$("#odTrack").value.trim();o.note=$("#odNote").value.trim();
  if(st==="Delivered"&&o.pay==="Cash on Delivery")o.payStatus="Paid";
  Promise.all([putO(o),...[...touched].map(pid=>putP(byId(pid)))]).then(()=>toast(`${o.id} saved · ${st}`)).catch(()=>{});
  closeLayer();renderAdmin();
}

   <h2 style="border-top:1px solid var(--line)">Admin</h2><div class="pb fgrid">
    <div class="full note" style="font-size:14px">Logged in as <b style="color:var(--fg)">${esc(adminEmail)}</b>. Change the admin password in Firebase console → Authentication → Users.</div>
    <div class="full"><button type="button" class="btn" data-a="notify">${typeof Notification!=="undefined"&&Notification.permission==="granted"?"New-order alerts are on":"Turn on new-order alerts"}</button></div>
    <p class="err full" id="setErr" hidden></p><div class="full"><button class="btn dark" type="submit">Save settings</button></div>
   </div></form>
   <div class="panel"><h2>Data</h2><div class="pb" style="display:flex;gap:10px;flex-wrap:wrap">
    ${products.length?"":`<button class="btn" data-a="seed">Load sample products</button>`}<button class="btn" data-a="clearSamples">Delete sample products & stores</button></div></div>`);
  $("#setForm").onsubmit=e=>{e.preventDefault();
    Object.assign(S,{shop:$("#sShop").value.trim()||"Styber",phone:$("#sPh").value.trim(),whatsapp:$("#sWa").value.replace(/\D/g,""),email:$("#sEm").value.trim(),address:$("#sAd").value.trim(),shipFee:Math.max(0,+$("#sShip").value||0),freeAbove:Math.max(0,+$("#sFree").value||0),lowStock:Math.max(0,+$("#sLow").value||0),razorpayKey:$("#sRz").value.trim(),online:$("#sOnline").checked,cod:$("#sCod").checked});
    putS().then(()=>{buildNav();toast("Settings saved");aSettings()}).catch(()=>{})};
}
const ACT={
  logout(){fauth.signOut().then(()=>go("home"))},
  newProduct(){productForm(null)},
  saveProduct,
  addSize(){const f=layer._pf;f.sync();f.d.sizes.push({s:"",stock:0});f.draw()},
  defSizes(){const f=layer._pf;f.sync();f.d.sizes=DEF_SIZES[ART_FOR(f.d.cat)].map(s=>({s,stock:10}));f.draw()},
  delProduct(id){confirmBox("Delete this product from the store?","Delete",()=>{delDoc("products",id).then(()=>{products=products.filter(p=>p.id!==id);cart=cart.filter(c=>c.pid!==id);saveCart();closeLayer();toast("Product deleted");renderAdmin()}).catch(()=>{})})},
  dupProduct(id){const p=JSON.parse(JSON.stringify(byId(id)));p.id="p"+Date.now();p.created=Date.now();p.name+=" (copy)";p.active=false;putP(p).then(()=>{if(!byId(p.id))products.unshift(p);toast("Copy created as hidden");productForm(p.id);renderAdmin()}).catch(()=>{})},
  saveOrder,
  delOrder(id){confirmBox(`Delete order ${id}? This cannot be undone.`,"Delete order",()=>{delDoc("orders",id).then(()=>{orders=orders.filter(o=>o.id!==id);closeLayer();toast("Order deleted");renderAdmin()}).catch(()=>{})})},
  copyMsg(){const t=$("#odMsg");copyText(t.value,t)},
  csv(){const rows=[["Order","Date","Customer","Phone","City","Items","Total","Payment","Pay status","Status","Tracking"],...orders.map(o=>[o.id,new Date(o.date).toLocaleString("en-IN"),o.customer.name,o.customer.phone,o.customer.city,o.items.map(i=>`${i.name} (${i.size}) x${i.qty}`).join("; "),o.total,o.pay,o.payStatus,o.status,o.tracking])];
    const txt=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");copyText(txt,null)},
  togCoupon(i){const c=coupons[i];c.active=!c.active;putC(c).then(aCoupons).catch(()=>{c.active=!c.active})},
  delCoupon(i){const code=coupons[i].code;confirmBox(`Delete coupon ${code}?`,"Delete",()=>{delDoc("coupons",code).then(()=>{coupons=coupons.filter(c=>c.code!==code);aCoupons()}).catch(()=>{})})},
  editStore(id){editStore=id;aStores();window.scrollTo({top:0})},
  cancelStore(){editStore=null;aStores()},
  delStore(id){confirmBox("Delete this store?","Delete",()=>{delDoc("stores",id).then(()=>{stores=stores.filter(s=>s.id!==id);aStores()}).catch(()=>{})})},
  clearSamples(){confirmBox("Delete all sample products and sample stores?","Delete samples",async()=>{
    const batch=fdb.batch();products.filter(p=>p.sample).forEach(p=>batch.delete(fdb.collection("products").doc(p.id)));stores.filter(x=>x.sample).forEach(x=>batch.delete(fdb.collection("stores").doc(x.id)));
    try{await batch.commit();toast("Samples deleted")}catch(e){fail(e)}})},
  async seed(){const batch=fdb.batch();seedProducts().forEach(p=>{p.sample=true;batch.set(fdb.collection("products").doc(p.id),p)});SAMPLE_COUPONS.forEach(c=>batch.set(fdb.collection("coupons").doc(c.code),c));SAMPLE_STORES.forEach(x=>batch.set(fdb.collection("stores").doc(x.id),x));batch.set(fdb.doc("settings/main"),publicSettings());
    toast("Loading samples...");try{await batch.commit();toast("Sample products loaded")}catch(e){try{fail(e)}catch(x){}}},
  notify(){if(typeof Notification==="undefined"){toast("This browser does not support alerts.");return}Notification.requestPermission().then(p=>{toast(p==="granted"?"New-order alerts are on":"Alerts are blocked. Allow notifications for this site in browser settings.");aSettings()})}
};
// live data
let beepCtx=null;
function beep(){try{beepCtx=beepCtx||new (window.AudioContext||window.webkitAudioContext)();const o=beepCtx.createOscillator(),g=beepCtx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.15,beepCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,beepCtx.currentTime+.5);o.connect(g);g.connect(beepCtx.destination);o.start();o.stop(beepCtx.currentTime+.5)}catch(e){}}
function newOrderAlert(o){
  toast(`New order · ${o.id} · ${rs(o.total)} · ${o.customer.name}`);beep();
  try{if(typeof Notification!=="undefined"&&Notification.permission==="granted"){new Notification(`New order ${o.id}`,{body:`${o.customer.name} · ${rs(o.total)} · ${o.items.length} item(s)`,icon:LOGO_MARK})}}catch(e){}
}
let started=false;
function refresh(){
  if(!ready.products||!ready.settings)return;
  if(!started){started=true;cart=cart.filter(c=>byId(c.pid));saveCart();const st=(location.hash||"").slice(1);go(st&&(CATS[st]||st==="stores"||st==="admin")?st:"home",false);return}
  if(layer.innerHTML||isTyping())return;
  if(current==="admin"){if(["dash","products","orders","customers"].includes(aView))renderAdmin()}
  else if(current==="home")home();else if(current==="stores")storesView();else if(!query&&CATS[current])collection(current);
}
function loadErr(e){console.error(e);app.innerHTML=`<div class="wrap"><div class="empty">The store could not load right now. Check your internet and refresh the page.<br><small>${esc(e&&e.code||"")}</small></div></div>`}
function startListeners(){
  fdb.collection("products").onSnapshot(q=>{products=q.docs.map(d=>d.data()).sort((a,b)=>(b.created||0)-(a.created||0));ready.products=true;refresh()},e=>{ready.products=true;loadErr(e)});
  fdb.doc("settings/main").onSnapshot(d=>{S=Object.assign({},DEF_SETTINGS,d.exists?d.data():{});ready.settings=true;buildNav();refresh()},e=>{ready.settings=true;loadErr(e)});
  fdb.collection("coupons").onSnapshot(q=>{coupons=q.docs.map(d=>d.data())},e=>console.warn(e));
  fdb.collection("stores").onSnapshot(q=>{stores=q.docs.map(d=>d.data());if(current==="stores"&&!layer.innerHTML)storesView();if(current==="admin"&&aView==="stores"&&!isTyping())renderAdmin()},e=>console.warn(e));
}
let ordersUnsub=null,firstOrders=true;
fauth.onAuthStateChanged(u=>{
  authChecked=true;authed=!!u;adminEmail=u?u.email:"";
  if(ordersUnsub){ordersUnsub();ordersUnsub=null}
  if(u){firstOrders=true;ordersUnsub=fdb.collection("orders").orderBy("date","desc").limit(500).onSnapshot(q=>{
      const added=q.docChanges().filter(c=>c.type==="added").map(c=>c.doc.data());
      orders=q.docs.map(d=>d.data());
      if(!firstOrders&&added.length)newOrderAlert(added[0]);
      firstOrders=false;if(current==="admin"&&!layer.innerHTML&&!isTyping())renderAdmin();
    },e=>{toast(e.code==="permission-denied"?"This account is not the admin. Check the email in the database rules.":"Orders could not load.");console.error(e)})}
  else orders=[];
  if(current==="admin")renderAdmin();
});

/* ================= ROUTER + EVENTS ================= */
let current="home";
function go(k,push=true){
  closeLayer();query="";colChip=null;colSort="feat";current=k;
  document.body.classList.toggle("is-admin",k==="admin");
  if(k==="admin")renderAdmin();else if(k==="home")home();else if(k==="stores")storesView();else if(CATS[k])collection(k);else{current="home";home()}
  document.querySelectorAll("nav.main li.open").forEach(l=>l.classList.remove("open"));
  if(push){try{history.replaceState(null,"","#"+k)}catch(e){}}
  try{window.scrollTo({top:0})}catch(e){}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-quick],[data-close],[data-tab],[data-chip],[data-q],[data-rm],[data-acc],[data-info],[data-toggle],[data-av],[data-a],[data-order],[data-edit],[data-of],[data-pf],[data-cust],[data-rmph],[data-mainph],[data-rmsz]");
  if(!t)return;const ds=t.dataset;
  if(ds.go){e.preventDefault();go(ds.go)}
  else if(ds.quick)quick(ds.quick);
  else if("close" in ds){if(e.target===t||t.tagName==="BUTTON")closeLayer()}
  else if(ds.tab){pickTab=ds.tab;home()}
  else if(ds.chip){colChip=colChip===ds.chip?null:ds.chip;collection(current)}
  else if(ds.q){const c=cart[+ds.q];const p=byId(c.pid),x=p.sizes.find(s=>s.s===c.size);if(+ds.d>0&&c.qty+1>+x.stock){toast(`Only ${x.stock} available in size ${c.size}`);return}c.qty+=+ds.d;if(c.qty<1)cart.splice(+ds.q,1);saveCart();openCart()}
  else if(ds.rm){cart.splice(+ds.rm,1);saveCart();openCart()}
  else if(ds.acc){const ul=$("#acc"+ds.acc);ul.hidden=!ul.hidden;t.setAttribute("aria-expanded",!ul.hidden);t.querySelector("span").textContent=ul.hidden?"+":"−"}
  else if(ds.info)info(ds.info);
  else if("toggle" in ds){const li=t.parentElement;const was=li.classList.contains("open");document.querySelectorAll("nav.main li.open").forEach(l=>l.classList.remove("open"));if(!was)li.classList.add("open")}
  else if(ds.av){aView=ds.av;renderAdmin();window.scrollTo({top:0})}
  else if(ds.a){e.preventDefault();ACT[ds.a]&&ACT[ds.a](ds.id)}
  else if(ds.order)orderDrawer(ds.order);
  else if(ds.edit)productForm(ds.edit);
  else if(ds.of){oFilter=ds.of;aOrders()}
  else if(ds.pf){pFilter=ds.pf;aProducts()}
  else if(ds.cust){oQuery=ds.cust;oFilter="All";aView="orders";renderAdmin()}
  else if(ds.rmph){const f=layer._pf;f.sync();f.d.photos.splice(+ds.rmph,1);f.draw()}
  else if(ds.mainph){const f=layer._pf;f.sync();const [x]=f.d.photos.splice(+ds.mainph,1);f.d.photos.unshift(x);f.draw()}
  else if(ds.rmsz){const f=layer._pf;f.sync();f.d.sizes.splice(+ds.rmsz,1);f.draw()}
});
document.addEventListener("change",e=>{if(e.target.id==="sortSel"){colSort=e.target.value;collection(current)}});
document.addEventListener("submit",e=>{if(e.target.id==="pForm"){e.preventDefault();saveProduct();return}if(e.target.id==="joinForm"){e.preventDefault();const m=$("#joinMsg");m.textContent="You're on the list. Watch your inbox for the next drop.";m.hidden=false;e.target.reset()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#cfm"))$("#cfm").remove();else closeLayer()}});
$("#menuBtn").onclick=openMenu;
$("#cartBtn").onclick=openCart;
$("#searchBtn").onclick=()=>{const b=$("#searchBar");b.hidden=!b.hidden;if(!b.hidden)$("#searchInput").focus()};
$("#searchInput").addEventListener("input",e=>{query=e.target.value.trim();if(query){current="all";collection("all")}else go("home",true)});

buildNav();
{const n=cart.reduce((a,c)=>a+c.qty,0);const el=$("#cartCount");el.textContent=n;el.hidden=!n}
app.innerHTML=`<div class="wrap"><div class="empty">Loading store...</div></div>`;
startListeners();


</script>
</body>
